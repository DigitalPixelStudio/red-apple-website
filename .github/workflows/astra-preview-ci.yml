name: Astra preview validation

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: astra-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate and patch dependency lockfile
        if: github.ref_name != 'main'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund --audit-level=high
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): patch vulnerable production dependency lockfile"
            git push origin "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint changed production files
        run: npx eslint . --quiet
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
