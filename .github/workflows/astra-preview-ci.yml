name: Astra preview validation

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: astra-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed production files
        run: npx eslint src/app/api/concierge/route.ts src/components/Concierge.tsx src/components/PWAInstallPrompt.tsx src/components/Navbar.tsx src/components/DynamicIsland.tsx src/components/SmartNudge.tsx src/components/ReviewsSection.tsx src/components/TrustProof.tsx src/app/page.tsx src/app/layout.tsx src/app/privacy/page.tsx src/app/robots.ts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
