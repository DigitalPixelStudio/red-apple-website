name: Astra preview validation

on:
  push:
    branches:
      - feat/astra-streaming-rag-memory
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: astra-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
