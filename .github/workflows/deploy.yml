name: Deploy to Vercel

# Manual production release for the project that owns www.redmobilerepair.in.
# Vercel has temporarily rate-limited new deployments; run after the quota resets.
on:
  workflow_dispatch:

concurrency:
  group: vercel-red-apple-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_X2IuKDqvHxg5BoaS61nc2mpg
  VERCEL_PROJECT_ID: prj_UXuax2HiAkDgB0MNqrTc10b52TFr

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check for the Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add VERCEL_TOKEN in GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build with production environment
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy the tested build to production
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deployment summary
        run: |
          {
            echo "### Red Apple production deployment"
            echo ""
            echo "**Project:** redmobile-repair.in"
            echo "**Production:** ${{ steps.deploy.outputs.url }}"
            echo "**Commit:** `${{ github.sha }}`"
          } >> "$GITHUB_STEP_SUMMARY"